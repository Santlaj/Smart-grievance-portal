services:
  database:
    image: mongo:7.0
    container_name: smart_grievance_db
    restart: always
    environment:
      MONGO_INITDB_DATABASE: egrievance
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart_grievance_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://database:27017/egrievance
      JWT_SECRET: smart_grievance_production_jwt_secret_key_2026_super_secure_random_seed_9876543210
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:8080
      MAX_REQUEST_BODY_BYTES: 1048576
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "5000:5000"
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: smart_grievance_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:

